spring.application.name=customer-service
server.port=8081
#pour utiliser h2 en memoire
spring.datasource.url=jdbc:h2:mem:customers-db
#pour avoir l'interface web pour consulter la bd h2
spring.h2.console.enabled=true
#pour ne pas avoir les logs de discovery parce que nous n'avons pas encore de service discovery
spring.cloud.discovery.enabled=false
#pour ne pas avoir les logs de config parce que nous n'avons pas encore de service config
spring.cloud.config.enabled=false